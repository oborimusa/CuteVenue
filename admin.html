<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Hotel Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👑 Admin Dashboard</h1>
            <p>Manage bookings, availability, and reminders</p>
        </header>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0;">
            <div style="background: #1a1a1a; padding: 20px; border-radius: 12px; text-align: center;">
                <h3>📅 Bookings</h3>
                <p style="font-size: 2rem; font-weight: 800; color: #f5a623;" id="bookingCount">0</p>
            </div>
            <div style="background: #1a1a1a; padding: 20px; border-radius: 12px; text-align: center;">
                <h3>💰 Revenue</h3>
                <p style="font-size: 2rem; font-weight: 800; color: #f5a623;" id="revenueTotal">N0</p>
            </div>
            <div style="background: #1a1a1a; padding: 20px; border-radius: 12px; text-align: center;">
                <h3>📊 Occupancy</h3>
                <p style="font-size: 2rem; font-weight: 800; color: #f5a623;" id="occupancyRate">0%</p>
            </div>
        </div>

        <div style="background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #222;">
            <h3 style="color: #fff; margin-bottom: 15px;">📋 Recent Bookings</h3>
            <div id="bookingsList">
                <p style="color: #666;">No bookings yet. Check back soon!</p>
            </div>
        </div>

        <div style="margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="sendAllReminders()" class="btn primary"><i class="fas fa-bell"></i> Send Reminders to All</button>
            <button onclick="exportReport()" class="btn secondary"><i class="fas fa-file-export"></i> Export Report</button>
        </div>
    </div>

    <script>
        // Simulated admin data
        function updateDashboard() {
            document.getElementById('bookingCount').textContent = '12';
            document.getElementById('revenueTotal').textContent = 'N2,450,000';
            document.getElementById('occupancyRate').textContent = '68%';
        }
        updateDashboard();

        function sendAllReminders() {
            alert('📧 Reminders sent to all upcoming bookings!');
        }

        function exportReport() {
            alert('📄 Report exported as CSV!');
        }
    </script>
</body>
</html>
